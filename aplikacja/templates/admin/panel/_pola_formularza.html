{{ form.non_field_errors }}
{% for pole in form %}
<div class="pole{% if pole.field.widget.input_type == 'checkbox' %} pole-wyboru{% endif %}">
	{% if pole.field.widget.input_type == 'checkbox' %}<label for="{{ pole.id_for_label }}">{{ pole }} {{ pole.label }}</label>{% else %}{{ pole.label_tag }}{{ pole }}{% endif %}
	{% if pole.help_text %}<small id="{{ pole.auto_id }}_helptext">{{ pole.help_text }}</small>{% endif %}
	{{ pole.errors }}
</div>
{% endfor %}
