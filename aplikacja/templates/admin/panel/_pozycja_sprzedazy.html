<tr class="pozycja">
	<td>
		{{ f.produkt }}
		<strong class="pozycja-nazwa"></strong>
		<small class="pozycja-cena"></small>
		{{ f.produkt.errors }}
	</td>
	<td class="liczba">
		<label class="ukryte" for="{{ f.masa_kg.id_for_label }}">Masa [kg]</label>
		{{ f.masa_kg }}
		{{ f.masa_kg.errors }}
	</td>
	<td class="liczba pozycja-wartosc"></td>
	<td><button type="button" class="usun" aria-label="Usuń pozycję">×</button></td>
</tr>
