{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Zmiana hasła – Warzywniak" %}{% endblock %}
{% block content %}
<div class="karta">
	<h1>{% translate "Zmiana hasła" %}</h1>
	<form method="post">
		{% csrf_token %}
		{% include "konta/_pola.html" %}
		<button class="przycisk" type="submit">{% translate "Zmień hasło" %}</button>
	</form>
	<p class="odnosniki"><a href="{% url 'konto' %}">{% translate "Wróć" %}</a></p>
</div>
{% endblock %}
