{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Logowanie – Warzywniak" %}{% endblock %}
{% block content %}
<div class="karta">
	<h1>{% translate "Logowanie" %}</h1>
	<form method="post">
		{% csrf_token %}
		{% include "konta/_pola.html" %}
		<input type="hidden" name="next" value="{{ next }}">
		<button class="przycisk" type="submit">{% translate "Zaloguj się" %}</button>
	</form>
	<p class="odnosniki"><a href="{% url 'haslo_reset' %}">{% translate "Nie pamiętam hasła" %}</a><a href="{% url 'rejestracja' %}">{% translate "Załóż konto" %}</a></p>
</div>
{% endblock %}
